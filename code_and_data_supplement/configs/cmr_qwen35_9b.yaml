# CMR configuration — Qwen3.5-9B (SGLang API, FP16)
# Section 6.1

model_name: "Qwen3.5-9B"
mode: "api"                                # SGLang/OpenAI-compatible API
api_base: "http://localhost:8000/v1"       # SGLang server endpoint

# Retrieval
top_k: 3
encoder_model: "all-MiniLM-L6-v2"

# Inference
temperature: 0.1
max_tokens: 1024
timeout: 120

# Prompt
prompt_version: "cpo_v1"
